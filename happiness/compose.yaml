# Happiness on your own server, with HTTPS from Caddy.
#
# 1. Point a domain name (say happiness.example.org) at the server; open ports 80 and 443.
# 2. Next to this file, create a .env file with:
#      ANTHROPIC_API_KEY=sk-ant-...
#      HAPPINESS_PASSWORD=a long passphrase
#      HAPPINESS_DOMAIN=happiness.example.org
#      TZ=Europe/Copenhagen
# 3. docker compose up -d --build
#
# Caddy fetches and renews the certificate by itself. Your memory and files live in the
# happiness-data volume.

services:
  happiness:
    build: .
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      HAPPINESS_PASSWORD: ${HAPPINESS_PASSWORD:?set HAPPINESS_PASSWORD in .env}
      HAPPINESS_MODEL: ${HAPPINESS_MODEL:-}
      HAPPINESS_EFFORT: ${HAPPINESS_EFFORT:-}
      HAPPINESS_WEB: ${HAPPINESS_WEB:-}
      TZ: ${TZ:-UTC}
    volumes:
      - happiness-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${HAPPINESS_DOMAIN:?set HAPPINESS_DOMAIN in .env} --to happiness:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - happiness

volumes:
  happiness-data:
  caddy-data:
